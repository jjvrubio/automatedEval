instrucciones_metodologicas:
  defaults:
    analisis_externo: >-
      Analiza si el TFM desarrolla de forma secuencial el PESTEL, las 5 Fuerzas de
      Porter, los grupos estratégicos, el ciclo de vida sectorial, el perfil de
      competidores, el estudio de mercado y clientes, la vigilancia tecnológica, el
      mapeo de stakeholders y la síntesis MEFE/DAFO. Evalúa calidad de datos, uso de
      indicadores, hallazgos accionables y coherencia entre modelos.
    analisis_interno: >-
      Comprueba si se realiza auditoría de recursos, cadena de valor, análisis
      financiero y organizacional, core competences, benchmarking interno y matriz
      VRIO. Valora profundidad, evidencia cuantitativa y si se vinculan hallazgos con la
      MEFI y conclusiones estratégicas.
    procesos_fabricacion_operativos:
      generico: >-
        Verifica si el TFM aplica Lean, Six Sigma/DMAIC, Value Stream Mapping o Teoría de
        Restricciones para rediseñar procesos, eliminar desperdicios y estabilizar la
        operación. Exige que se cuantifiquen tiempos de ciclo, inventario, capacidad y
        calidad, que se definan indicadores líder/rezagados y que se describa el sistema
        de seguimiento (tableros, responsables y cadencia). Evalúa la coherencia entre
        diagnóstico, contramedidas propuestas, gestión del cambio y mitigación de riesgos
        operativos.
      regulado: >-
        Verifica si el TFM aplica Lean, Six Sigma/DMAIC, Value Stream Mapping o Teoría de
        Restricciones en sectores regulados. Exige que la mejora se alinee con GMP/FDA/EMA,
        principios ALCOA+, gestión del riesgo (ICH Q9/Q10) y planes de validación,
        cuantificando impacto sin comprometer trazabilidad ni stock de seguridad.
      servicios_publicos: >-
        Evalúa la mejora de procesos en Administraciones Públicas o servicios ciudadanos.
        Comprueba que se modelen flujos con SIPOC/BPMN, se midan tiempos de tramitación,
        cargas de trabajo y cuellos de botella, y que se vinculen las acciones a la Ley
        39/2015, Ley 40/2015, ENS/ENI, protección de datos y principios de simplificación
        administrativa. Solicita indicadores de experiencia ciudadana, ROI social,
        gobernanza y gestión del cambio en funcionarios (formación, roles, cuadros de
        mando).
      fabricacion_continua: >-
        Revisa control estadístico, estabilidad de parámetros críticos y coordinación con
        mantenimiento y calidad. Pide indicadores OEE, SPC, alarmas tempranas y planes
        CAPA que aseguren flujo continuo y cumplimiento.
      fabricacion_discreta: >-
        Exige balanceo de línea, takt, SMED, Kanban y control de cuellos. Solicita datos
        de tiempos estándar, productividad por celda, retrabajos y conexión con el plan
        maestro o sistemas MES/Andon.
      cadena_suministro: >-
        Evalúa cómo la mejora operativa se integra con S&OP, inventarios segmentados y
        sincronización proveedor-planta-cliente. Pide justificar buffers, políticas de
        stock y mitigación de riesgos de abastecimiento.
      logistica: >-
        Asegúrate de que se vinculen cambios operativos con layout, slotting, WMS/TMS y
        métricas OTIF, fill-rate y coste por envío. Solicita evidencia de análisis de
        capacidad, productividad pick-pack y seguridad operativa.
      distribucion: >-
        Comprueba que las acciones operativas soporten la estrategia de canales y niveles
        de servicio. Pide indicadores por canal, coste-servicio, devoluciones y planes de
        experiencia cliente.
    procesos_logisticos_cadena_suministro:
      generico: >-
        Analiza si se utilizan marcos SCOR, análisis ABC de inventarios y diagnóstico de
        última milla para priorizar mejoras en la cadena de suministro y los KPI
        logísticos.
      cadena_suministro: >-
        Verifica la existencia de S&OP, planeación de demanda, segmentación ABC/XYZ y
        simulaciones de red. Exige métricas de resiliencia, lead time total y coste-to-
        serve.
      logistica: >-
        Evalúa layout, slotting, WMS/TMS, productividad pick-pack y dimensionamiento de
        flota. Solicita indicadores OTIF, uso de capacidad, tiempos muertos y estrategias
        de cross-docking.
      distribucion: >-
        Revisa la gestión omnicanal, acuerdos de nivel de servicio, última milla y
        devoluciones. Pide cuadros de mando por canal, margen contribución y experiencia
        cliente.
    procesos_administrativos_servicios: >-
      Comprueba si los procesos administrativos o de servicio se modelan con SIPOC, BPMN
      o swimlanes, se cuantifican tiempos de ciclo y se plantean indicadores de servicio
      tras el rediseño.
    procesos_causa_raiz: >-
      Revisa si se mapean procesos y causas raíz con SIPOC, Ishikawa, Pareto o FMEA, y si
      se priorizan acciones con datos cuantificados.
    analisis_financiero: >-
      Exige un modelo financiero con flujo de caja descontado, VAN, TIR, payback, ROI,
      ratio beneficio/coste y coste total de propiedad (TCO). Solicita documentar
      supuestos de inflación, estructura de financiación y análisis de sensibilidad con
      escenarios base/optimista/pesimista.
  metodologias_forzadas:
    analisis_financiero: true
  mapeo_criterios:
    analisis_financiero:
      - "desarrollo específico de la contribución"
      - "relación entre objetivos, planteamiento, desarrollo y conclusiones"
      - "proyecto"
      - "solución propuesta"
    analisis_externo:
      - "análisis del entorno"
      - "marco teórico y contextual"
      - "diagnóstico estratégico"
    analisis_interno:
      - "diagnóstico interno"
      - "análisis organizativo"
      - "capacidad de la entidad"
    procesos_fabricacion_operativos:
      - "procesos operativos"
      - "procesos productivos"
      - "mejora continua"
      - "lean"
      - "análisis de procesos"
      - "mejora de procesos"
      - "plan de implementación"
      - "proyecto"
      - "solución propuesta"
      - "desarrollo de la solución"
    procesos_logisticos_cadena_suministro:
      - "cadena de suministro"
      - "logística"
      - "supply chain"
      - "inventarios"
    procesos_administrativos_servicios:
      - "procesos administrativos"
      - "servicios"
      - "back office"
      - "experiencia de servicio"
  metadata:
    analisis_externo:
      palabras_clave:
