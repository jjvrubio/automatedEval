categorias:
  display_names:
    formato: "Formato y lenguaje"
    portada: "Portada, índice y resumen"
    introduccion: "Introducción y objetivos"
    estructura: "Contexto y marco teórico"
    proyecto: "Proyecto y desarrollo"
    conclusiones: "Conclusiones"
    limitaciones: "Limitaciones y prospectiva"
    referencias: "Referencias y anexos"
    general: "Análisis adicional"
  instrucciones_criterio_extendido:
    formato: >-
      Organiza la respuesta con los encabezados 'Consistencia formal', 'Evidencias detectadas' y
      'Acciones correctivas'. Describe estilo, ortografía, tipografía y cumplimiento de normas de
      redacción académica. Cita ejemplos concretos del documento y explica por qué afectan a la
      percepción académica.
    portada: >-
      Redacta tres apartados titulados 'Portada y metadatos', 'Índice y navegación' y 'Resumen y
      palabras clave'. Valora adhesión a la guía UNIR, coherencia entre encabezados y paginación,
      y precisión del resumen.
    introduccion: >-
      Estructura el análisis en 'Planteamiento del problema', 'Objetivos y alcance' y 'Metodología
      declarada'. Relaciona cada punto con la estrategia del trabajo e indica qué datos o
      referencias respaldan las afirmaciones.
    estructura: >-
      Utiliza los apartados 'Coherencia entre secciones', 'Cobertura de modelos' y 'Lagunas
      prioritarias'. Evalúa continuidad lógica del relato y ausencia de modelos exigidos.
    conclusiones: >-
      Divide el informe en 'Revisión de objetivos', 'Consistencia argumental' y 'Proyección y
      preguntas abiertas'. Señala discrepancias entre resultados y objetivos, y propone
      aclaraciones.
    limitaciones: >-
      Organiza en 'Identificación de riesgos', 'Planes de contingencia' y 'Pasos siguientes'.
      Destaca qué amenazas quedan sin cuantificar y qué mitigaciones requiere el proyecto.
    referencias: >-
      Presenta los apartados 'Consistencia cita-bibliografía', 'Cobertura temática' y 'Correcciones
      sugeridas'. Verifica normas APA y diversidad de fuentes.
    proyecto: >-
      Segmenta el análisis en 'Diagnóstico integral', 'Aplicación metodológica' y 'Viabilidad
      cuantitativa'. Conecta los hallazgos externo/interno con la solución y con los modelos
      financieros exigidos.
    general: >-
      Organiza el comentario en tres bloques con subtítulos claros. Explica qué evidencias sostienen
      la puntuación, qué brechas persisten y qué acciones son prioritarias.
goal: Homogeneous, critical, rigorous TFM evaluations.