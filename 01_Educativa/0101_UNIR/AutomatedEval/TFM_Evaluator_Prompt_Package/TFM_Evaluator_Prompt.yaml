        - "5 fuerzas"
        - "grupos estrategicos"
        - "mefe"
        - "oportunidades"
        - "amenazas"
        - "entorno"
        - "stakeholders externos"
      critico: true
      comentario_evaluacion: >-
        Cuestiona la pertinencia de cada modelo externo seleccionado y si se justifican
        las fuentes utilizadas (datos, benchmarks, tendencias). Señala incoherencias
        entre las conclusiones y los resultados de los modelos.
      comentario_falta: >-
        Si no hay evidencia de análisis externo (PESTEL, Porter, grupos estratégicos,
        MEFE), declara explícitamente la omisión, explica por qué compromete el
        diagnóstico del entorno y qué pasos deberían incorporarse.
    analisis_interno:
      palabras_clave:
        - "vrio"
        - "cadena de valor"
        - "recursos"
        - "capacidades"
        - "core competence"
        - "mefi"
        - "benchmarking"
        - "fortalezas"
        - "debilidades"
      critico: true
      comentario_evaluacion: >-
        Analiza si se justifican la selección de recursos y competencias clave, y si los
        modelos internos vinculan resultados cuantitativos con la estrategia.
      comentario_falta: >-
        Cuando no se aplica un análisis interno riguroso (VRIO, cadena de valor,
        benchmarking interno), remarcar la ausencia y detallar qué información debería
        haberse desarrollado para fundamentar fortalezas y debilidades.
    procesos_fabricacion_operativos:
      palabras_clave:
        - "lean"
        - "lean manufacturing"
        - "lean management"
        - "lean production"
        - "lean six sigma"
        - "kaizen"
        - "six sigma"
        - "6 sigma"
        - "dmaic"
        - "dmac"
        - "value stream mapping"
        - "value stream map"
        - "vsm"
        - "toc"
        - "teoria de restricciones"
        - "constraint"
        - "gmp"
        - "good manufacturing practice"
        - "good manufacturing practices"
        - "normas gmp"
        - "fda"
        - "food and drug administration"
        - "normas fda"
        - "ema"
        - "fmea"
        - "5 porques"
        - "gemba"
        - "valor agregado"
        - "cuellos de botella"
        - "pareto"
        - "alcoa"
        - "alcoa+"
        - "quality risk management"
        - "qrm"
        - "ich q9"
        - "ich q10"
        - "ich q7"
        - "ich q8"
        - "annex 1"
        - "pics"
        - "quality by design"
        - "qbd"
        - "quality management system"
        - "oee"
        - "takt"
        - "smed"
        - "kanban"
        - "mes"
        - "andon"
        - "spc"
        - "capability"
        - "pat"
      critico: false
      comentario_evaluacion: >-
        Desglosa la justificación en tres secciones numeradas: (1) Adecuación conceptual
        y teórica de Lean/Six Sigma frente a las obligaciones GMP/FDA (cita autores y
        páginas del TFM); (2) Viabilidad operativa y de compliance, analizando cómo la
        propuesta respeta ALCOA+, QRM (ICH Q9/Q10), validaciones, redundancias
        obligatorias y stock de seguridad; (3) Riesgos, limitaciones y oportunidades,
        mencionando guías regulatorias (FDA, EMA, PIC/S, Annex 1) y sinergias con QbD o
        el sistema de calidad. Destaca los fragmentos que sustentan cada punto y exige
        mitigaciones cuando falten.
      comentario_falta: >-
        Cuando no se documentan herramientas de mejora operativa, declara la ausencia
        como riesgo regulatorio. Recomienda incorporar Lean, Six Sigma (DMAIC), Value
        Stream Mapping o TOC especificando cómo cumplirían GMP/FDA (ALCOA+, trazabilidad
        documental, QRM) y qué verificaciones deberían añadirse para mantener la calidad.
    procesos_logisticos_cadena_suministro:
      palabras_clave:
        - "scor"
        - "supply chain operations reference"
        - "supply chain"
        - "cadena de suministro"
        - "logistica"
        - "logístico"
        - "analisis abc"
        - "clasificacion abc"
        - "abc"
        - "ultima milla"
        - "last mile"
        - "pareto"
        - "s&op"
        - "sales and operations planning"
        - "planificacion de la demanda"
        - "warehouse"
        - "almacenaje"
        - "wms"
        - "tms"
        - "otif"
        - "fill rate"
        - "fulfillment"
      critico: false
      comentario_evaluacion: >-
        Evalúa si se modela la cadena de suministro con SCOR, análisis ABC y diagnósticos
        de última milla para priorizar mejoras logísticas.
      comentario_falta: >-
        Si no se analiza la cadena logística, solicita incorporar SCOR, análisis ABC de
        inventarios y evaluación de última milla para fundamentar la propuesta.
    procesos_administrativos_servicios:
      palabras_clave:
        - "sipoc"
        - "bpm"
        - "bpmn"
        - "business process management"
        - "business process modeling notation"
        - "business process modelling notation"
        - "swimlane"
        - "service blueprint"
        - "customer journey"
      critico: false
      comentario_evaluacion: >-
        Comprueba si los procesos administrativos o de servicios se representan con
        SIPOC, BPMN o swimlanes y si la evidencia respalda los tiempos y cargas
        declaradas.
      comentario_falta: >-
        Si no se documentan estos procesos, pide modelarlos con SIPOC/BPMN/swimlane y
        detalla cómo medir desempeño y tiempos de ciclo tras la intervención.
    analisis_financiero:
      palabras_clave:
        - "roi"
        - "retorno"
        - "van"
        - "valor actual neto"
        - "tir"
        - "tasa interna"
        - "payback"
        - "flujo de caja"
        - "cash flow"
        - "escenarios"
        - "total cost of ownership"
        - "tco"
        - "coste total de propiedad"
      critico: true
      comentario_evaluacion: >-
        Exige que el análisis financiero explique supuestos, coherencia entre escenarios
        y sensibilidad, y que los indicadores se utilicen para tomar decisiones.
      comentario_falta: >-
        Si no hay evidencias financieras (ROI, VAN, TIR, payback, flujos de caja), indica
        la omisión y orienta sobre cómo construir un modelo económico que respalde la
        viabilidad.

