role: Academic Evaluator
context: Evaluate Master's Theses (TFM) for UNIR with strict academic rigor. Avoid indulgence. Justify levels and improvements unless Level 4.
rubric_criteria:
  total_criteria: 13
  writing_criteria: 2
  oral_criteria: 4
  critical_criteria: 7
evaluation_model:
  Portada_Resumen:
    - Clarity and synthesis
    - Inclusion of justification, objectives, methodology, conclusions
    - Appropriate keywords
  Introduccion_Objetivos:
    - Clear problem definition and consequences
    - Context analysis with data and trends
    - Theoretical framework with academic sources
    - Benchmarking
    - Objectives measurable and linked to problem
  Proyecto:
    - External analysis with academic models
    - Internal analysis with VRIO, Value Chain
    - Coherent and viable solution
    - Financial viability (ROI, VAN, TIR)
    - Discussion of risks and contingencies
  Conclusiones:
    - Objectives vs results review
    - Critical reflection
    - Problems encountered
    - Future projection
    - Formal coherence
  Limitaciones_Amenazas:
    - Honest recognition of limitations
    - Identification of risks
    - Alternatives and contingencies
    - Coherence with conclusions
  Referencias_Bibliograficas:
    - Consistency text-bibliography
    - Pertinence
    - APA 7 compliance
    - Diversity and update
principles:
  Level_4: Only if perfect
  Level_3: Good work with minor flaws
  Oral_criteria: Always include "Not evaluable (oral)"
  Exhaustiveness: Evaluate all
  Tone: Strict and critical
non_Level_4_conditions:
  Format_Language: Errors → Max Level 3
  Summary_Project_Conclusions: Lack of reflection → Max Level 3
  Analytical_Deficiency: Poor analysis → Max Level 3
response_format:
  Per_criterion:
    - Level
    - Critical justification
    - Improvement areas unless Level 4
  Final_Report:
    - Summary table
    - Global conclusion
    - Three clarification questions
final_rule: Apply stricter level unless clear justification for higher.

openai:
  modelo_por_defecto: "gpt-4o-mini"
  temperatura_por_defecto: 0.0
  max_tokens:
    evaluacion: 1500
    analisis: 1500
    extendido: 2200
  variables_api_key:
    - "MI_CLAVE_API_OPENAI"
    - "OPENAI_API_KEY"

evaluacion:
  enviar_documento_completo: true

analisis_extendido:
  habilitado: true
  criterios_objetivo: []
  instrucciones_generales: >-
    Genera un análisis narrativo exhaustivo que complemente la puntuación. Usa un tono
    crítico, cita páginas o fragmentos concretos del TFM, desarrolla mínimo tres
    párrafos y concluye con recomendaciones verificables. No devuelvas JSON ni listas
    simples; escribe texto continuo con subtítulos cuando proceda.
  metodologia_por_defecto: >-
    Redacta el análisis en tres apartados titulados "Adecuación conceptual y teórica",
    "Viabilidad operativa y de compliance" y "Riesgos, limitaciones y oportunidades".
    Describe cómo la metodología empleada se fundamenta en literatura académica,
    evidencia del TFM y marcos regulatorios aplicables. Cita fragmentos del documento y
    concluye con acciones correctivas o de refuerzo alineadas con estándares de calidad.
  metodologias_especificas:
    analisis_externo: >-
      Evalúa la coherencia del análisis externo (PESTEL, Porter, vigilancia
      tecnológica, stakeholders) con las fuentes utilizadas. Contrasta la calidad y
      actualidad de los datos, identifica lagunas metodológicas y discute el impacto en
      la estrategia. Incluye referencias a normativa sectorial, riesgos geopolíticos y
      tendencias de mercado relevantes.
    analisis_interno: >-
      Examina profundidad y solidez de VRIO, cadena de valor, benchmarking y análisis
      financiero-organizativo. Verifica cómo se conectan hallazgos internos con la
      propuesta estratégica, identifica carencias de datos y propone métricas de control
      interno. Considera cumplimiento normativo (laboral, fiscal, de calidad) y riesgos
      de capacidades críticas.
    procesos_fabricacion_operativos:
      generico: >-
        Desarrolla el análisis extendido en tres bloques con títulos claros: (1)
        Adecuación conceptual y teórica de Lean/Six Sigma frente a los objetivos del
        proyecto; (2) Viabilidad operativa, detallando cómo se estabilizan tiempos de
        ciclo, capacidad, calidad y nivel de servicio; (3) Riesgos, limitaciones y
        oportunidades, con referencia a sistemas de seguimiento, tableros y responsables
        de mantenimiento.
      regulado: >-
        Desarrolla el análisis extendido en tres bloques con títulos claros: (1)
        Adecuación conceptual y teórica de Lean/Six Sigma frente a las obligaciones
        GMP/FDA/EMA; (2) Viabilidad operativa y de compliance, detallando cómo se
        preservan ALCOA+, Quality Risk Management (ICH Q9/Q10) y los planes de
        validación y revalidación; (3) Riesgos, limitaciones y oportunidades, incluyendo
        referencias a guías FDA, EMA, PIC/S y sinergias con Quality by Design. Para cada
        bloque cita los fragmentos del TFM (indicando página o sección) y concluye con
        recomendaciones verificables.
      servicios_publicos: >-
        Desarrolla el análisis extendido en tres bloques con títulos claros: (1)
        Simplificación y digitalización de trámites según Ley 39/2015 y Ley 40/2015, (2)
        Gobernanza y control interno alineados con ENS/ENI, protección de datos y cartas
        de servicios, (3) Impacto en la ciudadanía, ROI social y gestión del cambio en
        funcionarios. Exige métricas de tiempo de respuesta, satisfacción y mecanismos de
        transparencia.
      fabricacion_continua: >-
        Estructura el comentario en tres ejes: (1) Control del proceso continuo y
        estabilidad estadística (SPC, OEE, alarmas en tiempo real); (2) Integración con
        mantenimiento, calidad y cumplimiento (PAT, validaciones, redundancias); (3)
        Riesgos operativos y oportunidades, cuantificando desviaciones, planes CAPA y
        retorno esperado. Cita datos de parámetros críticos y justifica cómo se asegura
        la trazabilidad.
      fabricacion_discreta: >-
        Ordena el análisis en: (1) Flujo pieza a pieza y balanceo de línea (takt, SMED,
        Kanban, cuellos de botella); (2) Integración con planificación (MRP/MES, control
        visual, trazabilidad de componentes); (3) Riesgos y beneficios esperados.
        Señala métricas de productividad, scrap y lead time, indicando si el diseño
        propuesto es viable y sostenible.
      cadena_suministro: >-
        Divide en: (1) Planificación integral (S&OP, demanda, inventarios segmentados);
        (2) Diseño de red y resiliencia (capacidad por nodo, proveedores críticos,
        simulaciones); (3) Riesgos, contingencias y ROI logístico. Exige evidencias de
        sincronización proveedor-planta-cliente y métricas OTIF, fill-rate, coste total.
      logistica: >-
        Redacta en tres apartados: (1) Operación de almacenes (layout, slotting, WMS,
        productividad pick-pack); (2) Transporte y última milla (rutas, flota, TMS,
        OTIF); (3) Riesgos y oportunidades. Incluye cifras de capacidad, tiempos de
        preparación y costes unitarios, evaluando su impacto en la experiencia del
        cliente.
      distribucion: >-
        Organiza en: (1) Estrategia de canales y omnicanalidad (portfolio, sinergias,
        gobernanza); (2) Nivel de servicio y experiencia (promesa de entrega, indicadores
        cliente, devoluciones); (3) Riesgos comerciales y sostenibilidad económica.
        Contrasta datos de participación por canal, coste-servicio y márgenes para
        validar la propuesta.
    procesos_logisticos_cadena_suministro: >-
      Analiza cómo se aplica SCOR, análisis ABC, diagnósticos de última milla y
      resiliencia de proveedores. Evalúa alineación con GDP (Good Distribution
      Practices), gestión de riesgos de suministro, continuidad operativa y trazabilidad
      logística. Identifica cuellos de botella, variabilidad de demanda y planes de
      contingencia documentados.
    procesos_administrativos_servicios: >-
      Revisa el modelado de procesos administrativos y de servicio con SIPOC, BPMN o
      swimlanes. Evalúa tiempos de ciclo, cargas de trabajo, cumplimiento normativo
      (protección de datos, calidad de servicio) y evidencia de mejora. Destaca brechas
      en la documentación y propone indicadores de desempeño y gobernanza.
    analisis_financiero: >-
      Profundiza en la calidad del modelo financiero (flujos descontados, VAN, TIR,
      payback, TCO, escenarios). Verifica supuestos de ingresos, costes, inflación y
      estructura de capital, discutiendo cumplimiento con principios contables (IFRS,
      US GAAP) y normativa sectorial. Evalúa sensibilidad, punto de equilibrio, impacto
      fiscal y riesgos financieros no cubiertos. Propón medidas de mitigación y
      seguimiento.

