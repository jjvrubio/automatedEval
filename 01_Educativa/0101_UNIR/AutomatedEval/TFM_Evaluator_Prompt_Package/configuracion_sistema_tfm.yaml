# Configuración de Rutas y Archivos del Sistema TFM
# ===================================================

# Rutas de archivos del sistema
rutas_sistema:
  # Rutas de rúbricas por etiqueta
  rubricas:
    MUDPE: "/Users/juanjo/Documents/Personal/JJVR/automatizaciones/automatedEval/TFM_Evaluator_Prompt_Package/rubrica MUDPE.xlsx"
    MUGPTD: "/Users/juanjo/Documents/Personal/JJVR/automatizaciones/automatedEval/TFM_Evaluator_Prompt_Package/rubrica MUGPTD.xlsx"
  
  # Archivo de instrucciones externas
  instrucciones_ultraestrictas: "/Users/juanjo/Documents/Personal/JJVR/automatizaciones/automatedEval/TFM_Evaluator_Prompt_Package/Ultraestricto.md"
  
  # Archivos de configuración
  configuracion_extraccion: "/Users/juanjo/Documents/Personal/JJVR/automatizaciones/automatedEval/TFM_Evaluator_Prompt_Package/configuracion_extraccion_datos.yaml"
  plantillas_preguntas: "/Users/juanjo/Documents/Personal/JJVR/automatizaciones/automatedEval/TFM_Evaluator_Prompt_Package/plantillas_preguntas.yaml"
  plantillas_analisis: "/Users/juanjo/Documents/Personal/JJVR/automatizaciones/automatedEval/TFM_Evaluator_Prompt_Package/plantillas_analisis_critico.yaml"

# Configuración de OpenAI
onedrive_config:
  hints_deteccion:
    - "OneDrive"
    - "OneDrive - "
  herramienta_hidratacion: "/usr/bin/fileproviderctl"

# Configuración de archivos
archivos_config:
  # Extensiones soportadas para TFM
  extensiones_tfm:
    - "pdf"
    - "docx"
  
  # Configuración de normalización
  forzar_nfc: true
  
  # Archivos de salida
  nombres_salida:
    csv: "evaluacion_tfm_resultado.csv"
    markdown: "evaluacion_tfm_informe.md"
    json: "evaluacion_tfm_informe.json"
    log: "evaluador_tfm_integrado.log"

# Configuración de rúbricas
rubricas_config:
  # Criterios a excluir por tipo de rúbrica
  exclusiones:
    MUGPTD:
      numero_criterios: 8
      criterios_excluir: [7, 8]  # Presentación oral
      descripcion: "Excluir criterios 7 y 8 (presentación oral)"
    
    MUDPE:
      numero_criterios: 13
      criterios_excluir_formula: "ultimos_4"  # Últimos 4 criterios
      descripcion: "Excluir los últimos 4 criterios (presentación oral)"
  
  # Detección automática de niveles
  deteccion_niveles:
    mudpe:
      patron_busqueda: "Nivel"
      niveles_esperados: ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"]
    
    mugptd:
      patrones_busqueda: ["suspenso", "aprobado", "notable", "sobresaliente"]
      niveles_esperados:
        - "Suspenso (0-4)"
        - "Aprobado (5-6)"
        - "Notable (7-8)"
        - "Sobresaliente (9-10)"

# Mensajes del sistema
mensajes_sistema:
  dialogos:
    seleccion_rubrica:
      titulo: "Selecciona la rúbrica"
      mensaje: "No se detectaron etiquetas Finder MUDPE/MUGPTD o hay ambigüedad. Elige la rúbrica a aplicar."
      opciones:
        - "MUDPE"
        - "MUGPTD"
    
    seleccion_tfm:
      titulo: "Selecciona el TFM del alumno"
      mensaje: "Elige el archivo PDF o DOCX del TFM"
  
  errores:
    api_key_faltante: "Falta la variable de entorno MI_CLAVE_API_OPENAI u OPENAI_API_KEY"
    archivo_no_encontrado: "No se encontró el archivo: {ruta}"
    rubrica_vacia: "La rúbrica está vacía"
    selector_gui_requerido: "El selector GUI de AppKit es requerido"
    dialogo_rubrica_error: "No se pudo abrir el diálogo de rúbrica"
  
  logging:
    inicio_evaluacion: "🔄 Iniciando evaluación del criterio {numero}: {criterio}"
    criterio_completado: "✅ Criterio {numero} evaluado - '{criterio}': {nivel}"
    criterio_oral_excluido: "⏩ Criterio {numero} (presentación oral) marcado como No evaluable: {criterio}"
    extraccion_completada: "📊 EXTRACCIÓN COMPLETADA"

# Configuración de logging
logging_config:
  nivel_por_defecto: "INFO"
  formato: "%(asctime)s [%(levelname)s] %(message)s"
  nombre_logger: "evaluador_tfm_integrado_sin_cli"
  
  # Tipos de handlers
  handlers:
    consola:
      tipo: "StreamHandler"
      activo: true
    
    archivo:
      tipo: "FileHandler"
      modo: "w"
      encoding: "utf-8"
      nombre_archivo: "evaluador_tfm_integrado.log"