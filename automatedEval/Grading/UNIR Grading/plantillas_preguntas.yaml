# Configuración para generar preguntas dinámicas basadas en la evaluación de TFMs

configuracion:
  numero_preguntas: 3
  criterios_minimos: 2  # Mínimo de criterios con problemas para generar preguntas específicas

# Plantillas de preguntas según el tipo de problema detectado
plantillas_preguntas:
  
  # Preguntas para criterios con nivel bajo (N1 o N2)
  nivel_bajo:
    - "¿Podría explicar con mayor detalle cómo aborda el aspecto de '{criterio}' en su trabajo?"
    - "¿Qué evidencias adicionales podría proporcionar para fortalecer el desarrollo de '{criterio}'?"
    - "¿Cómo podría mejorar la argumentación relacionada con '{criterio}' para hacerla más sólida?"
    - "¿Considera que el tratamiento de '{criterio}' refleja adecuadamente la profundidad esperada para un TFM?"
    - "¿Qué aspectos específicos de '{criterio}' cree que podrían beneficiarse de una mayor elaboración?"

  # Preguntas para criterios marcados como "No evaluable"
  no_evaluable:
    - "¿Podría aclarar cómo ha desarrollado '{criterio}' en su trabajo, ya que no queda suficientemente claro en el documento?"
    - "¿Dónde podríamos encontrar más información sobre '{criterio}' en su TFM?"
    - "¿Cómo podría hacer más evidente el tratamiento de '{criterio}' en su trabajo?"

  # Preguntas sobre coherencia entre criterios relacionados
  coherencia:
    - "¿Cómo se relacionan entre sí los aspectos de '{criterio1}' y '{criterio2}' en su trabajo?"
    - "¿Podría explicar la coherencia entre '{criterio1}' y '{criterio2}' en el desarrollo de su investigación?"
    - "¿De qué manera '{criterio1}' fundamenta o apoya '{criterio2}' en su propuesta?"

  # Preguntas generales para casos con múltiples problemas
  generales:
    - "¿Qué aspectos de su metodología considera que podrían clarificarse para mejorar la comprensión del trabajo?"
    - "¿Cómo podría fortalecer la conexión entre los objetivos planteados y los resultados obtenidos?"
    - "¿Qué evidencias adicionales considera que serían más convincentes para apoyar sus conclusiones?"
    - "¿Cómo podría mejorar la estructura argumentativa de las secciones que considera más débiles?"
    - "¿Qué aspectos del marco teórico podrían desarrollarse más para fundamentar mejor su investigación?"

# Criterios relacionados para detectar problemas de coherencia
grupos_coherencia:
  metodologia:
    - "metodología"
    - "diseño"
    - "procedimiento"
    - "método"
  
  resultados:
    - "resultados"
    - "análisis"
    - "datos"
    - "hallazgos"
  
  objetivos:
    - "objetivos"
    - "hipótesis"
    - "preguntas"
    - "propósito"
  
  marco_teorico:
    - "marco teórico"
    - "fundamentación"
    - "antecedentes"
    - "revisión"